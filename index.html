<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reddit Meme Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 26, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem;
            z-index: 1000;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .stats {
            font-size: 0.9rem;
            color: #888;
        }

        .gallery {
            margin-top: 120px;
            padding: 1rem;
            columns: 5;
            column-gap: 1rem;
            column-fill: balance;
        }

        @media (max-width: 1600px) {
            .gallery { columns: 4; }
        }

        @media (max-width: 1200px) {
            .gallery { columns: 3; }
        }

        @media (max-width: 800px) {
            .gallery { columns: 2; }
        }

        @media (max-width: 500px) {
            .gallery { columns: 1; }
        }

        .image-item {
            break-inside: avoid;
            margin-bottom: 1rem;
            background: #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .image-item img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .image-info {
            padding: 0.75rem;
            font-size: 0.8rem;
            color: #ccc;
            word-break: break-all;
        }

        .loading {
            text-align: center;
            padding: 2rem;
            font-size: 1.2rem;
            color: #888;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            transition: transform 0.1s ease;
            cursor: grab;
        }

        .modal-content:active {
            cursor: grabbing;
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: white;
            cursor: pointer;
            z-index: 2001;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Reddit Meme Gallery</h1>
        <div class="stats">
            <span id="imageCount">Loading...</span> images found
        </div>
    </div>

    <div class="loading" id="loading">Loading images...</div>
    <div class="gallery" id="gallery"></div>

    <div class="modal" id="modal">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <img class="modal-content" id="modalImage">
    </div>

    <script>
        let images = [];
        let loadedCount = 0;
        let currentZoom = 1;
        let isDragging = false;
        let startX, startY, translateX = 0, translateY = 0;

        async function loadImages() {
            try {
                const response = await fetch('/images.json');
                images = await response.json();
                
                document.getElementById('imageCount').textContent = images.length;
                document.getElementById('loading').style.display = 'none';
                
                renderGallery();
            } catch (error) {
                console.error('Error loading images:', error);
                document.getElementById('loading').innerHTML = '<div class="error">Error loading images. Please check if images.json exists.</div>';
            }
        }

        function renderGallery() {
            const gallery = document.getElementById('gallery');
            
            images.forEach((imagePath, index) => {
                const imageItem = document.createElement('div');
                imageItem.className = 'image-item';
                
                const img = document.createElement('img');
                img.src = imagePath;
                img.alt = `Meme ${index + 1}`;
                img.loading = 'lazy';
                img.onclick = () => openModal(imagePath);
                
                const info = document.createElement('div');
                info.className = 'image-info';
                info.textContent = imagePath.split('/').pop();
                
                imageItem.appendChild(img);
                imageItem.appendChild(info);
                gallery.appendChild(imageItem);
            });
        }

        function openModal(imageSrc) {
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modalImage');
            modalImage.src = imageSrc;
            modal.classList.add('active');
            
            // Reset zoom and position
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
            updateImageTransform();
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.remove('active');
            
            // Reset zoom and position
            currentZoom = 1;
            translateX = 0;
            translateY = 0;
        }

        function updateImageTransform() {
            const modalImage = document.getElementById('modalImage');
            modalImage.style.transform = `scale(${currentZoom}) translate(${translateX}px, ${translateY}px)`;
        }

        function handleZoom(event) {
            if (!document.getElementById('modal').classList.contains('active')) return;
            
            event.preventDefault();
            
            const zoomSpeed = 0.1;
            const minZoom = 0.5;
            const maxZoom = 5;
            
            if (event.deltaY < 0) {
                // Zoom in
                currentZoom = Math.min(currentZoom + zoomSpeed, maxZoom);
            } else {
                // Zoom out
                currentZoom = Math.max(currentZoom - zoomSpeed, minZoom);
            }
            
            updateImageTransform();
        }

        function handleMouseDown(event) {
            if (!document.getElementById('modal').classList.contains('active')) return;
            if (event.target.id !== 'modalImage') return;
            
            isDragging = true;
            startX = event.clientX - translateX;
            startY = event.clientY - translateY;
            event.preventDefault();
        }

        function handleMouseMove(event) {
            if (!isDragging) return;
            
            translateX = event.clientX - startX;
            translateY = event.clientY - startY;
            updateImageTransform();
        }

        function handleMouseUp() {
            isDragging = false;
        }

        // Close modal on click outside image
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Close modal on escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // Add zoom and drag functionality
        document.addEventListener('wheel', handleZoom, { passive: false });
        document.addEventListener('mousedown', handleMouseDown);
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);

        // Prevent context menu on modal image
        document.getElementById('modalImage').addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Load images when page loads
        loadImages();
    </script>
</body>
</html>
